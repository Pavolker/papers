<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papers — Paulo Volker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 800px;
            margin: 80px auto;
            padding: 0 20px;
            color: #1a1a1a;
            line-height: 1.6;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .subtitle {
            color: #666;
            margin-bottom: 48px;
            font-size: 16px;
        }
        .paper-list {
            list-style: none;
        }
        .paper-item {
            padding: 24px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        .paper-item:last-child {
            border-bottom: none;
        }
        .paper-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .paper-title a {
            color: #1a1a1a;
            text-decoration: none;
        }
        .paper-title a:hover {
            color: #0066cc;
            text-decoration: underline;
        }
        .paper-meta {
            font-size: 14px;
            color: #666;
        }
        .paper-description {
            margin-top: 12px;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Papers</h1>
    <div class="subtitle">Paulo Volker</div>
    
    <ul class="paper-list">
        <li class="paper-item">
            <div class="paper-title">
                <a href="odisseia-pessoal.pdf">Odisséia Pessoal</a>
            </div>
            <div class="paper-meta">Setembro de 2026</div>
            <div class="paper-description">
                Uma reflexão sobre a jornada humana através do cosmos — medindo a existência não pelo tempo, mas pela distância percorrida pelo Universo.
            </div>
        </li>
    </ul>
</body>
</html>
